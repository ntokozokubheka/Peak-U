# Optional one-click hosting blueprint for Render (https://render.com).
# Check Render's current free-tier terms first: free databases can expire.
services:
  - type: web
    name: peak-u
    runtime: node
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: peak-db, property: connectionString }
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
databases:
  - name: peak-db
